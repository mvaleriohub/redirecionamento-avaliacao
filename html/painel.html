<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Painel de Placas</title>
    <link rel="stylesheet" href="../css/painel-provisorio.css">
    <link rel="stylesheet" href="../css/painel-provisorio-medias.css">
    <script src="../js/qrcode.js" defer></script>
    <script src="../js/geradorqr.js" defer></script>
    <script src="../js/painel.js" defer></script>
</head>
<body>
    <header>
        <h1>Painel de <span>Placas</span></h1>
        <button id="sair" class="oculto">Sair</button>
    </header>
    <main>
        <section id="login">
            <form id="formLogin">
                <label for="email">E-mail</label>
                <input type="email" id="email" autocomplete="username" required>
                <label for="senha">Senha</label>
                <input type="password" id="senha" autocomplete="current-password" required>
                <button type="submit">Entrar</button>
                <p id="erroLogin" class="erro"></p>
            </form>
        </section>
        <section id="segundofator" class="oculto">
            <form id="formCodigo">
                <label for="codigoAcesso">Código do app autenticador</label>
                <input type="text" id="codigoAcesso" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required>
                <button type="submit">Confirmar</button>
                <p id="erroCodigo" class="erro"></p>
            </form>
        </section>
        <section id="configurar" class="oculto">
            <form id="formConfigurar">
                <h2>Ativar verificação em duas etapas</h2>
                <p>1. Abra um app autenticador (Google Authenticator, Microsoft Authenticator, Authy...) e escaneie o QR.</p>
                <div id="qrConfigurar"></div>
                <p>Ou digite esta chave no app e <strong>guarde-a no gerenciador de senhas</strong>, para recuperar o acesso se perder o celular:</p>
                <p><code id="chaveConfigurar"></code></p>
                <label for="codigoConfigurar">2. Digite o código de 6 dígitos que o app mostra</label>
                <input type="text" id="codigoConfigurar" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required>
                <button type="submit">Ativar</button>
                <p id="erroConfigurar" class="erro"></p>
            </form>
        </section>
        <section id="painel" class="oculto">
            <p id="mensagem"></p>
            <div id="barra">
                <input type="search" id="busca" placeholder="Buscar por código ou cliente">
                <select id="filtro">
                    <option value="ativas">Ativas</option>
                    <option value="lote">Em lote</option>
                    <option value="inativas">Inativas</option>
                    <option value="todas">Todas</option>
                </select>
            </div>
            <div id="acoes">
                <button id="novaPlaca">Cadastrar direto</button>
                <button id="novoLote">Cadastrar lote inativo</button>
            </div>
            <div id="barraQr">
                <select id="formatoQr">
                    <option value="svg">QR em SVG</option>
                    <option value="png">QR em PNG</option>
                </select>
                <button type="button" id="baixarLote">Baixar QRs da lista (ZIP)</button>
            </div>
            <p id="destinoQr"></p>
            <button type="button" id="exportarCsv" class="textual">Exportar backup das placas (CSV)</button>
            <form id="formLote" class="oculto">
                <label for="campoQuantidade">Quantidade de placas</label>
                <input type="number" id="campoQuantidade" min="1" max="100" value="10">
                <div class="linha">
                    <button type="submit">Gerar lote</button>
                    <button type="button" id="cancelarLote">Cancelar</button>
                </div>
            </form>
            <form id="editor" class="oculto">
                <label for="campoCodigo">Código</label>
                <div class="linha">
                    <input type="text" id="campoCodigo" maxlength="12" autocapitalize="off" autocomplete="off">
                    <button type="button" id="gerarCodigo">Gerar</button>
                </div>
                <label for="campoCliente">Cliente</label>
                <input type="text" id="campoCliente" autocomplete="off">
                <label for="campoLink" id="rotuloLink">Place ID</label>
                <input type="text" id="campoLink" placeholder="Cole o Place ID (ChIJ...)" autocomplete="off">
                <button type="button" id="trocarModo" class="textual">Usar o link completo</button>
                <label class="opcao"><input type="checkbox" id="campoAtiva"> Placa ativa</label>
                <label for="campoData">Data da venda</label>
                <input type="date" id="campoData">
                <div id="previaQr" class="oculto"></div>
                <button type="button" id="baixarQr" class="oculto">Baixar QR desta placa</button>
                <div class="linha">
                    <button type="submit">Salvar</button>
                    <button type="button" id="cancelar">Cancelar</button>
                </div>
                <button type="button" id="excluir" class="oculto">Excluir placa</button>
            </form>
            <ul id="lista"></ul>
        </section>
    </main>
</body>
</html>
