<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <base href="/redirecionamento-avaliacao/">
    <title>Página não encontrada</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/medias-queries.css">
    <script src="js/tema.js"></script>
    <script src="js/contato.js" defer></script>
    <script src="js/pagina404.js" defer></script>
</head>
<body>
    <main>
        <section id="erro">
            <picture>
                <source media="(min-width: 768px)" srcset="img/mascote-perdido.webp">
                <img src="img/mascote-confuso.webp" alt="Mascote em forma de placa NFC, confuso, segurando um mapa" width="640" height="663">
            </picture>
            <h1>Ops! Parece que nos perdemos por aqui.</h1>
            <p id="descricao">Não encontramos a página que você tentou abrir.</p>
            <div id="placa" class="oculto">
                <p class="titulo">Código consultado</p>
                <code id="codigoconsultado"></code>
                <p>Ela pode não existir ou estar inativa. A placa deveria estar funcionando, mas parou?</p>
                <button id="confirmar">Sim, deveria estar funcionando</button>
                <div id="resposta" class="oculto">
                    <p>Fale com a gente pelo WhatsApp que resolvemos rápido.</p>
                    <a id="whatsapp" class="botao" href="#" target="_blank" rel="noopener">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
                        Falar no WhatsApp
                    </a>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
