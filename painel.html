<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Painel de Placas</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="medias-queries.css">
    <script src="painel.js" defer></script>
</head>
<body>
    <header>
        <h1>Painel de <span>Placas</span></h1>
        <button id="sair" class="oculto">Sair</button>
    </header>
    <main>
        <section id="login">
            <form id="formLogin">
                <label for="email">E-mail</label>
                <input type="email" id="email" autocomplete="username" required>
                <label for="senha">Senha</label>
                <input type="password" id="senha" autocomplete="current-password" required>
                <button type="submit">Entrar</button>
                <p id="erroLogin" class="erro"></p>
            </form>
        </section>
        <section id="painel" class="oculto">
            <p id="mensagem"></p>
            <div id="barra">
                <input type="search" id="busca" placeholder="Buscar por código ou cliente">
                <select id="filtro">
                    <option value="ativas">Ativas</option>
                    <option value="lote">Em lote</option>
                    <option value="inativas">Inativas</option>
                    <option value="todas">Todas</option>
                </select>
            </div>
            <div id="acoes">
                <button id="novaPlaca">Cadastrar direto</button>
                <button id="novoLote">Cadastrar lote inativo</button>
            </div>
            <form id="formLote" class="oculto">
                <label for="campoQuantidade">Quantidade de placas</label>
                <input type="number" id="campoQuantidade" min="1" max="100" value="10">
                <div class="linha">
                    <button type="submit">Gerar lote</button>
                    <button type="button" id="cancelarLote">Cancelar</button>
                </div>
            </form>
            <form id="editor" class="oculto">
                <label for="campoCodigo">Código</label>
                <div class="linha">
                    <input type="text" id="campoCodigo" maxlength="12" autocapitalize="off" autocomplete="off">
                    <button type="button" id="gerarCodigo">Gerar</button>
                </div>
                <label for="campoCliente">Cliente</label>
                <input type="text" id="campoCliente" autocomplete="off">
                <label for="campoLink" id="rotuloLink">Place ID</label>
                <input type="text" id="campoLink" placeholder="Cole o Place ID (ChIJ...)" autocomplete="off">
                <button type="button" id="trocarModo" class="textual">Usar o link completo</button>
                <label class="opcao"><input type="checkbox" id="campoAtiva"> Placa ativa</label>
                <label for="campoData">Data da venda</label>
                <input type="date" id="campoData">
                <div class="linha">
                    <button type="submit">Salvar</button>
                    <button type="button" id="cancelar">Cancelar</button>
                </div>
                <button type="button" id="excluir" class="oculto">Excluir placa</button>
            </form>
            <ul id="lista"></ul>
        </section>
    </main>
</body>
</html>
